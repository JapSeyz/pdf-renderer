name: run-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            testbench: "8.*"
            laravel: "10"
          - php: "8.3"
            testbench: "8.*"
            laravel: "10"
          - php: "8.2"
            testbench: "9.*"
            laravel: "11"
          - php: "8.4"
            testbench: "9.*"
            laravel: "11"
          - php: "8.2"
            testbench: "10.*"
            laravel: "12"
          - php: "8.4"
            testbench: "10.*"
            laravel: "12"
          - php: "8.3"
            testbench: "11.*"
            laravel: "13"
          - php: "8.4"
            testbench: "11.*"
            laravel: "13"
          - php: "8.5"
            testbench: "11.*"
            laravel: "13"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          # roave/security-advisories blocks installing Laravel < 12.60 / < 13.10,
          # so drop it when testing the still-supported legacy versions.
          composer remove roave/security-advisories --dev --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction

      - name: Lint
        run: find src config -name '*.php' -print0 | xargs -0 -n1 php -l
